name: Validate

on:
  push:
    branches: [main, "feat/greenfield-*"]
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Frozen install (lifecycle scripts disabled by .npmrc)
        run: npm exec --yes --package=pnpm@12.4.1 -- pnpm install --frozen-lockfile
      - name: Restore pinned test browsers (lockfile-keyed; Linux dependencies still install)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/browsers
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Provision pinned test browsers and Linux dependencies
        run: npm exec --yes --package=pnpm@12.4.1 -- pnpm browsers:install --with-deps
      - name: Configure reference cache outside workspace
        run: echo "PROPELLR_REFERENCE_CACHE=$RUNNER_TEMP/propellr-reference/axe-core-4.13.0" >> "$GITHUB_ENV"
      - name: Obtain independently integrity-pinned reference outside workspace
        run: npm exec --yes --package=pnpm@12.4.1 -- pnpm reference:prepare
      - name: Build, types, lint, required formatting, contracts, host, playbooks, parity, components and reporting
        run: npm exec --yes --package=pnpm@12.4.1 -- pnpm validate
